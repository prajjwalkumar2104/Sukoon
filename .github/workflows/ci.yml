name: Sukoon CI Pipeline

# This workflow triggers on every push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up the Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Standard LTS version for Next.js
          cache: 'npm'      # Speeds up installation by caching dependencies

      # 3. Install project dependencies cleanly
      - name: Install Dependencies
        run: npm ci

      # 4. Check for syntax and formatting errors
      - name: Run ESLint
        run: npm run lint

      # 5. Verify the Next.js production build works
      - name: Build Project
        run: npm run build